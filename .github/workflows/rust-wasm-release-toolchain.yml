name: Rust・Wasm供給網を検証する

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  path-boundary:
    name: ${{ matrix.os }} のcanonical path境界
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: 対象commitだけを取得する
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: reviewed Rust toolchainを用意する
        shell: pwsh
        run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - name: digest固定済みwasm-bindgenを用意する
        shell: pwsh
        run: ./scripts/install-release-wasm-bindgen.ps1
      - name: version・digest・link境界を同じpolicyで検証する
        shell: pwsh
        run: |
          $platform = if ($IsWindows) { "windows-x86_64" } else { "linux-x86_64" }
          $executable = if ($IsWindows) { "wasm-bindgen.exe" } else { "wasm-bindgen" }
          $tool = Join-Path $PWD ".tools/wasm-bindgen-0.2.126/$platform/$executable"
          ./scripts/test-rust-wasm-toolchain.ps1 -WasmBindgenPath $tool

  release-build:
    name: 同一preflightからrelease成果物を作る
    runs-on: windows-latest
    steps:
      - name: 対象commitだけを取得する
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: reviewed Rust toolchainを用意する
        shell: pwsh
        run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - name: digest固定済みwasm-bindgenを用意する
        shell: pwsh
        run: ./scripts/install-release-wasm-bindgen.ps1
      - name: Rust workspaceを検証する
        shell: pwsh
        run: cargo +1.93.0 test --workspace --locked
      - name: Node policy fixtureを検証する
        shell: pwsh
        run: |
          $tests = @(
            Get-ChildItem -LiteralPath "apps/client/tests" -Filter "*.test.mjs" -File |
              Select-Object -ExpandProperty FullName
          )
          node --test @tests
      - name: release buildをfail-closedで作る
        shell: pwsh
        run: |
          $tool = Join-Path $PWD ".tools/wasm-bindgen-0.2.126/windows-x86_64/wasm-bindgen.exe"
          ./scripts/build-web.ps1 `
            -CargoPath cargo `
            -WasmBindgenPath $tool `
            -ExpectedGitCommit $env:GITHUB_SHA
