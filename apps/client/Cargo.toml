[package]
name = "kotae-client"
description = "Rust/Wasm client for KOTAE AI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["web", "lib", "launch"] }
kotae-answer-print = { path = "../../crates/answer_print" }
kotae-audio-core = { path = "../../crates/audio_core" }
kotae-audio-vault = { path = "../../crates/audio_vault" }
serde.workspace = true
web-sys = { version = "=0.3.103", features = [
    "AnalyserNode",
    "AudioContext",
    "AudioNode",
    "Location",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
js-sys = "=0.3.103"
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"

[lints.rust]
unsafe_code = "forbid"
